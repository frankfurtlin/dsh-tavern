[project]
name = "story-reader"
version = "1.0.0"
requires-python = ">=3.12,<3.14"
dependencies = ["fastapi==0.115.12", "uvicorn==0.34.2", "sqlalchemy==2.0.40", "psycopg[binary]==3.2.6", "alembic==1.15.2", "pydantic-settings==2.8.1", "python-multipart==0.0.20", "argon2-cffi==23.1.0", "PyJWT==2.10.1", "cryptography==44.0.2", "httpx==0.28.1", "beautifulsoup4==4.13.3", "defusedxml==0.7.1", "charset-normalizer==3.4.1", "Pillow==11.1.0"]

[project.optional-dependencies]
test = ["pytest==9.0.3", "pytest-cov==6.1.1"]
object-storage = ["minio==7.2.20"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["tests"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["prompts/*.txt", "scripts/samples/*.txt", "scripts/samples/*.json"]
