server {
  listen 80;
  server_tokens off;
  client_max_body_size 51m;
  root /usr/share/nginx/html;
  add_header X-Content-Type-Options nosniff always;
  # Existing private-library BYOK uses fetch to the explicitly configured host.
  # Its URL validator permits HTTPS and HTTP loopback only; preserve that
  # boundary here while scripts, images and frames keep their existing policy.
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; connect-src 'self' blob: https: http://localhost:* http://127.0.0.1:*; object-src 'none'; base-uri 'self'; frame-ancestors 'self'" always;
  resolver 127.0.0.11 valid=5s ipv6=off;
  set $reader_api http://api:8000;
  proxy_set_header X-Forwarded-For $remote_addr;
  proxy_set_header X-Forwarded-Proto $scheme;
  location = /api/reader/v1/backups/prepare {
    # Portable archives have a separate bounded streaming channel. 1 MiB leaves
    # room for the encrypted header and multipart framing above the 2 GiB ZIP.
    client_max_body_size 2113m;
    client_body_timeout 120s;
    proxy_pass $reader_api;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_send_timeout 3600s;
    proxy_read_timeout 3600s;
  }
  location /api/ { proxy_pass $reader_api; proxy_buffering off; proxy_read_timeout 150s; }
  location /health/ { proxy_pass $reader_api; }
  location / { try_files $uri $uri/ /index.html; }
}
