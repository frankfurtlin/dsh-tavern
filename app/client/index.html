<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#fafaf8"><title>故事之间</title><style>.reader-startup{box-sizing:border-box;min-height:70vh;max-width:440px;margin:auto;padding:18vh 28px 56px;text-align:center;font-family:system-ui,sans-serif;color:#292c31}.reader-startup-mark{display:grid;place-items:center;width:48px;height:48px;margin:0 auto 20px;border:1px solid #e4e1da;border-radius:12px;color:#a55530;font-size:22px;background:#fafaf8}.reader-startup h1{margin:0;font-size:23px;font-weight:600}.reader-startup p{margin:14px 0 28px;font-size:14px;color:#77746e}.reader-startup-lines{display:grid;gap:12px;text-align:left}.reader-startup-lines span{display:block;height:13px;border-radius:6px;background:#eeece7}.reader-startup-lines span:last-child{width:65%}</style></head><body><div id="app"><section class="reader-startup" role="status" aria-label="正在打开故事之间"><div class="reader-startup-mark" aria-hidden="true">阅</div><h1>故事之间</h1><p>正在打开你的故事…</p><div class="reader-startup-lines" aria-hidden="true"><span></span><span></span><span></span></div></section></div><script type="module" src="/src/main.ts"></script></body></html>
