server {
  listen 80;
  server_tokens off;
  root /usr/share/nginx/html;
  add_header X-Content-Type-Options nosniff always;
  add_header X-Robots-Tag "noindex, nofollow" always;
  resolver 127.0.0.11 valid=5s ipv6=off;
  set $reader_api http://api:8000;
  proxy_set_header X-Forwarded-For $remote_addr;
  proxy_set_header X-Forwarded-Proto $scheme;
  location /api/ { proxy_pass $reader_api; proxy_buffering off; proxy_read_timeout 30s; }
  location /health/ { proxy_pass $reader_api; }
  location = / { try_files /insights.html =404; }
  location / { try_files $uri $uri/ /insights.html; }
}
