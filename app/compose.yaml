name: '${COMPOSE_PROJECT_NAME:-story-reader}'
x-server: &server
  build: ./server
  env_file: .env
  environment:
    STORAGE_PATH: /data/private
    INTERACTIVE_WORLD_ENABLED: ${INTERACTIVE_WORLD_ENABLED:-true}
  extra_hosts:
    - '${PROVIDER_HOST_MAPPING:-reader-no-provider.invalid:192.0.2.1}'
  volumes:
    - private-data:/data/private
  restart: unless-stopped
services:
  db:
    image: postgres:16.13-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -h 127.0.0.1 -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped
  migrate:
    <<: *server
    command: [alembic, upgrade, head]
    restart: "no"
    depends_on:
      db: {condition: service_healthy}
  api:
    <<: *server
    depends_on:
      migrate: {condition: service_completed_successfully}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready')"]
      interval: 5s
      timeout: 3s
      retries: 30
  worker:
    <<: *server
    command: [python, -m, app.worker]
    depends_on:
      migrate: {condition: service_completed_successfully}
  world-migrate:
    <<: *server
    command: [python, -m, app.world.migrate]
    restart: "no"
    depends_on:
      migrate: {condition: service_completed_successfully}
  world-worker:
    <<: *server
    command: [python, -m, app.world.worker]
    depends_on:
      world-migrate: {condition: service_completed_successfully}
  web:
    image: story-between-web:local
    build:
      context: ./client
      args:
        VITE_PUBLIC_ORIGIN: ${VITE_PUBLIC_ORIGIN:-}
        VITE_RELEASE: ${STORY_RELEASE:-}
    ports:
      - '${APP_BIND_ADDRESS:-127.0.0.1}:${APP_PORT:-8810}:80'
    depends_on:
      api: {condition: service_healthy}
    restart: unless-stopped
  insights:
    image: story-between-web:local
    build: ./client
    ports:
      - '${APP_BIND_ADDRESS:-127.0.0.1}:${INSIGHTS_PORT:-8812}:80'
    volumes:
      - ./client/nginx.insights.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api: {condition: service_healthy}
    restart: unless-stopped
  test-db:
    image: postgres:16.13-alpine
    profiles: [test]
    environment: {POSTGRES_USER: test, POSTGRES_PASSWORD: test-isolated, POSTGRES_DB: reader_test}
    tmpfs: [/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, pg_isready -h 127.0.0.1 -U test -d reader_test]
      interval: 2s
      retries: 30
  test-backend:
    build: ./server
    profiles: [test]
    environment:
      DATABASE_URL: postgresql+psycopg://test:test-isolated@test-db:5432/reader_test
      JWT_SIGNING_SECRET: isolated-test-secret-never-used-for-real-data
      PROVIDER_MASTER_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      AI_MODE: mock
      INTERACTIVE_WORLD_ENABLED: "true"
      STORAGE_PATH: /tmp/reader-tests
    command: [pytest, --ignore=tests/test_portable_domain.py, --junitxml=/artifacts/backend-junit.xml]
    volumes: ['${TEST_ARTIFACTS_DIR:-./artifacts/tests}:/artifacts']
    depends_on:
      test-db: {condition: service_healthy}
  test-web:
    build: {context: ./client, target: build}
    profiles: [test]
    command: [sh, -c, 'npm run typecheck && npm run test:unit && npm run build']
  portable-test-db:
    image: postgres:16.13-alpine
    profiles: [portable-test]
    environment: {POSTGRES_USER: test, POSTGRES_PASSWORD: portable-test-isolated, POSTGRES_DB: portable_test}
    tmpfs: [/var/lib/postgresql/data]
    networks:
      portable-tests:
        aliases: [db]
    healthcheck:
      test: [CMD-SHELL, pg_isready -h 127.0.0.1 -U test -d portable_test]
      interval: 2s
      timeout: 3s
      retries: 30
  portable-test-backend:
    build: ./server
    profiles: [portable-test]
    networks: [portable-tests]
    environment:
      DATABASE_URL: postgresql+psycopg://test:portable-test-isolated@db:5432/portable_test
      JWT_SIGNING_SECRET: isolated-test-secret-never-used-for-real-data
      PROVIDER_MASTER_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      AI_MODE: mock
      INTERACTIVE_WORLD_ENABLED: "true"
      ALLOW_LIVE_TESTS: "false"
      LIVE_TEST_MAX_CALLS: "0"
      STORAGE_PATH: /tmp/portable-private
    command: [pytest, tests/test_portable_domain.py, --junitxml=/artifacts/portable-junit.xml]
    volumes: ['${TEST_ARTIFACTS_DIR:-./artifacts/tests}:/artifacts']
    depends_on:
      portable-test-db: {condition: service_healthy}
networks:
  portable-tests:
    internal: true
volumes:
  postgres-data:
  private-data:
