name: Validate release
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
        working-directory: client
      - run: npm run typecheck && npm run test:unit && npm run build
        working-directory: client
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: isolated-ci-only
          POSTGRES_DB: reader_ci_test
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U test -d reader_ci_test" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://test:isolated-ci-only@127.0.0.1:5432/reader_ci_test
      JWT_SIGNING_SECRET: synthetic-ci-signing-secret-never-production
      PROVIDER_MASTER_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      AI_MODE: mock
      INTERACTIVE_WORLD_ENABLED: 'true'
      ALLOW_LIVE_TESTS: 'false'
      LIVE_TEST_MAX_CALLS: '0'
      STORAGE_PATH: /tmp/story-between-ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: server/requirements.lock
      - run: pip install -r requirements.lock
        working-directory: server
      - run: python -m pytest -q tests/test_analytics_unlimited.py tests/test_product_foundation.py tests/test_play_controls_world_chat.py tests/test_author_canvas_trials.py tests/test_scene_p0.py tests/test_scene_pipeline.py tests/test_account_onboarding.py tests/test_portrait_stage.py
        working-directory: server
